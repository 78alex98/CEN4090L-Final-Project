name: bartering-server

services:
  db:
    container_name: bartering-db
    image: postgres:17.4
    environment:
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PGUSER"]
      interval: 1s
      timeout: 5s
      retries: 30
  
  api:
    container_name: bartering-api
    depends_on:
      db:
        condition: service_healthy  # Wait for db to be ready before starting
    build:
      context: .
      dockerfile: ./.dockerfiles/api.Dockerfile
    ports:
      - "5096:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BarteringContext: Host=bartering-db;Port=5432;Database=bartering;Username=postgres;Password=postgres

volumes:
  pg-data:
